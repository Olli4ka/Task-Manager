<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
    <link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    >
</head>
<body class="container">



    <h1 class="my-4">{{ task.title }}</h1>
    <ul class="list-group">
        <li class="list-group-item">Description: {{ task.description }}</li>
        <li class="list-group-item">Status: {{ task.is_completed }}</li>
        <li class="list-group-item">Created: {{ task.created_at }}</li>
    </ul>



    <a href="{% url 'task_list' %}" class="btn btn-secondary">To Task List</a>



</body>
</html>
