<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body class="container">
<h1 class="my-4">Task List</h1>
<a href="{% url 'task_create' %}" class="btn btn-primary mb-3">Add Task</a>
<ul class="list-group">
    {% for task in tasks %}

    <li class="list-group-item d-flex justify-content-between align-items-center">
           <span> {% if task.is_completed %}
               <span class="text-success fs-4">●</span>
               {% else %}
               <span class="text-danger fs-4">●</span>
               {% endif %}
               {{ task.title }}
           </span>
        <span>
                <a href="{% url 'task_detail' task.pk %}" class="btn btn-sm btn-success">View Task</a>
                <a href="{% url 'task_update' task.pk %}" class="btn btn-sm btn-warning">Update Task</a>
                <a href="{% url 'task_delete' task.pk %}" class="btn btn-sm btn-danger">Delete Task</a>
            </span>
    </li>
    {% endfor %}
</ul>
</body>
</html>
